<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <figure id="menu-container">
            <div>
                <img src="./images/menu.png" alt="botão de menu">
                <img src="./images/youtube 1.png" alt="logo do youtube">
            </div>
            <div id="search-feature">
                <input type="text" placeholder="pesquisar...">
                <img src="./images/search.png" alt="botão de pesquisa">
            </div>
            <div>
                <img src="./images/video.png" alt="botão criar">
                <img src="./images/bell.png" alt="botão de notificações">
                <img src="./images/Avatar.png" alt="imagem de avatar">
            </div>
        </figure>
    </header>
    <main>
    <aside id="sidebar-container">
        <figure>
            <div>
                <img src="./images/home.png" alt="botão de início">
                    <figcaption>Home</figcaption>
            </div>
            <div>
                <img src="./images/compass.png" alt="botão de explorar">
                    <figcaption>Explorar</figcaption>
            </div>
            <div>
                <img src="./images/youtube.png" alt="botão de inscrições">
                    <figcaption>Inscrições</figcaption>
            </div>
            <div>
                <img src="./images/disc.png" alt="botão para o youtube music">
                    <figcaption>YouTube Music</figcaption>
            </div>
            <div>
                <img src="./images/thumbs-up.png" alt="botão vídeos que gostei">
                    <figcaption>Vídeos que gostei</figcaption>
            </div>
            <div>
                <img src="./images/clock.png" alt="botão de assistir mais tarde">
                    <figcaption>Assistir mais tarde</figcaption>
            </div>
            <div>
                <img src="./images/download.png" alt="botão de downloads">
                    <figcaption>Downloads</figcaption>
            </div>
            <div>
                <img src="./images/film.png" alt="botão para a aba de filmes">
                    <figcaption>Filmes</figcaption>
            </div>
            <div>
                <img src="./images/book.png" alt="botão para a aba aprender">
                    <figcaption>Aprender</figcaption>
            </div>
            <div>
                <img src="./images/award.png" alt="botão para a aba de esportes">
                    <figcaption>Esportes</figcaption>
            </div>
        </figure>
    </aside>
    <aside id="videos-container">
        <img src="./images/image 16.png" alt="">
        <img src="./images/image 16 (1).png" alt="">
        <img src="./images/image 16 (2).png" alt="">
        <img src="./images/image 16 (3).png" alt="">
        <img src="./images/image 16 (4).png" alt="">
        <img src="./images/image 16.png" alt="">
        <img src="./images/image 16 (1).png" alt="">
        <img src="./images/image 16 (2).png" alt="">
        <img src="./images/image 16 (3).png" alt="">
        <img src="./images/image 16 (4).png" alt="">
        
        
        
        
    </aside>
    </main>
    <footer>

    </footer>
</body>
</html>
